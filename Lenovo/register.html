<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Lenovo Learning Platform</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: rgb(152, 218, 218);
            margin: 0;
            padding: 0;
        }

        .nav1 {
            background-color: rgb(118, 229, 225);
            display: flex;
            align-items: center;
            padding: 10px 20px;
            flex-wrap: wrap;
        }

        .nav1 img {
            height: 80px;
            width: 80px;
            border-radius: 50%;
            margin-right: 30px;
        }

        .nav1 a {
            color: chocolate;
            padding: 0 15px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.5s;
        }

        .nav1 a:hover {
            color: blue;
        }

        .card {
            background-color: #d7c5c5;
            border: 2px solid blueviolet;
        }

        h2 {
            color: chocolate;
        }


        footer {
            text-align: center;
            background-color: rgb(118, 229, 225);
            padding: 15px;
            font-weight: bold;
            margin-top: 50px;
        }
    </style>
</head>

<body>

    <nav class="nav1">
        <img src="https://img.magnific.com/premium-vector/eqh-logo-design-initial-letter-eqh-monogram-logo-using-hexagon-shape_1101554-16445.jpg?semt=ais_hybrid&w=740&q=80"
            alt="Logo">

        <a href="home.html">Home</a>
        <a href="course.html">Course</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="login.html">Login</a>
    </nav>
    <hr>

    <div class="container my-5">

        <div class="card shadow-lg p-4 mx-auto" style="max-width:800px; border-radius:20px;">

            <h2 class="text-center mb-4 text-primary">
                Student Registration Form
            </h2>

            <form>

                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-control" placeholder="Enter your full name">
                </div>

                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-control" placeholder="Enter your email">
                </div>

                <div class="mb-3">
                    <label class="form-label">Phone Number</label>
                    <input type="tel" class="form-control" placeholder="Enter your phone number">
                </div>

                <div class="mb-3">
                    <label class="form-label d-block">Gender</label>

                    <input type="radio" name="gender"> Male
                    &nbsp;&nbsp;

                    <input type="radio" name="gender"> Female
                    &nbsp;&nbsp;

                    <input type="radio" name="gender"> Other
                </div>

                <div class="mb-3">
                    <label class="form-label">Course</label>
                    <select class="form-select">
                        <option>Select Course</option>
                        <option>Java</option>
                        <option>Python</option>
                        <option>C Programming</option>
                        <option>Web Development</option>
                        <option>Data Structures</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Highest Qualification</label>
                    <select class="form-select">
                        <option>Select Qualification</option>
                        <option>Intermediate</option>
                        <option>Diploma</option>
                        <option>B.Tech</option>
                        <option>M.Tech</option>
                        <option>MCA</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Address</label>
                    <textarea class="form-control" rows="4" placeholder="Enter your address"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Upload Resume</label>
                    <input type="file" class="form-control">
                </div>

                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="terms">
                    <label class="form-check-label" for="terms">
                        I agree to the Terms & Conditions
                    </label>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Register
                </button>

            </form>

        </div>

    </div>
    <hr>



    <footer>
        &copy; 2026 Lenovo Learning Platform | All Rights Reserved
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
