<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Lenovo Learning Platform</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: rgb(152, 218, 218);
            margin: 0;
            padding: 0;
        }

        .nav1 {
            background-color: rgb(118, 229, 225);
            display: flex;
            align-items: center;
            padding: 10px 20px;
            flex-wrap: wrap;
        }

        .nav1 img {
            height: 80px;
            width: 80px;
            border-radius: 50%;
            margin-right: 30px;
        }

        .nav1 a {
            color: chocolate;
            padding: 0 15px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.5s;
        }

        .nav1 a:hover {
            color: blue;
        }

        .login-card {
            max-width: 450px;
            margin: 80px auto;
            padding: 30px;
            background-color: #d7c5c5;
            border: 2px solid blueviolet;
            border-radius: 20px;
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.2);
        }

        .login-card h2 {
            text-align: center;
            color: chocolate;
            margin-bottom: 25px;
        }

        .btn-login {
            background-color: chocolate;
            color: white;
            width: 100%;
            font-weight: bold;
        }

        .btn-login:hover {
            background-color: darkorange;
            color: white;
        }

        footer {
            text-align: center;
            background-color: rgb(118, 229, 225);
            padding: 15px;
            font-weight: bold;
            margin-top: 50px;
        }
    </style>
</head>

<body>

    <nav class="nav1">
        <img src="https://img.magnific.com/premium-vector/eqh-logo-design-initial-letter-eqh-monogram-logo-using-hexagon-shape_1101554-16445.jpg?semt=ais_hybrid&w=740&q=80"
            alt="Logo">

        <a href="home.html">Home</a>
        <a href="course.html">Course</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="login.html">Login</a>
    </nav>

    <div class="container">

        <div class="login-card">

            <h2>Login</h2>

            <form>

                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-control" placeholder="Enter Email">
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" placeholder="Enter Password">
                </div>

                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input">
                    <label class="form-check-label">Remember Me</label>
                </div>

                <button type="submit" class="btn btn-login">
                    Login
                </button>

            </form>

            <div class="text-center mt-3">
                <a href="#">Forgot Password?</a>
            </div>

            <div class="text-center mt-2">
                Don't have an account?
                <a href="register.html">Register</a>
            </div>

        </div>

    </div>

    <footer>
        &copy; 2026 Lenovo Learning Platform | All Rights Reserved
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
